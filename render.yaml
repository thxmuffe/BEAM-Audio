services:
  - type: web
    name: beamaudio
    runtime: docker
    rootDir: src/Services/ReceptionDesk
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: BA_DESK_BIND
        value: 0.0.0.0
      - key: PORT
        value: 10000
